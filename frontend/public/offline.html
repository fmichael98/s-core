<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>SApp · Non raggiungibile</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #0a0a0a; color: #fafafa; padding: 24px; box-sizing: border-box; }
  .card { max-width: 360px; text-align: center; border: 1px solid #262626; border-radius: 14px; padding: 28px 24px; background: #171717; }
  h1 { font-size: 20px; margin: 0 0 8px; } h1 span { color: #60a5fa; }
 
  p { color: #a3a3a3; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
  button { background: #2563eb; color: #ffffff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <h1>S<span>App</span></h1>
  <p>Il server non risponde: controlla la connessione (o se SApp si sta aggiornando) e riprova tra poco.</p>
  <button onclick="location.reload()">Riprova</button>
</div>
<script>addEventListener('online', () => location.reload())</script>
</body>
</html>
