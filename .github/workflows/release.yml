# A ogni push su main, in automatico:
#  1. se c'è android/: compila l'app Android (Kotlin + Compose) → "SApp X.Y.apk"
#  2. compila la pagina web (frontend/, React + shadcn/ui) e il server (crates/, Rust), con le prove
#  3. pubblica la release "vX.Y.Z": lo zip del server (con dentro l'APK, che il server offre ai telefoni) e l'APK
# Sulle pull request: le stesse prove e compilazioni, senza pubblicare niente (un errore si vede prima del merge).
# In s-core (il modello) si compila e si prova tutto, ma non si pubblica mai.
#
# Firma APK: chiave in android/signing/ (sempre la stessa: un'app nuova si installa sopra la vecchia), o nei Secrets
# UPLOAD_KEYSTORE_B64, UPLOAD_STORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD.
# Firma dello zip: se c'è packaging/firma.pub, SHA256SUMS firmato col segreto SAPP_FIRMA.
name: Release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  APP: SApp
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: C'è l'app Android?
        id: has
        run: |
          if [ -f android/settings.gradle ]; then echo "android=1" >> "$GITHUB_OUTPUT"; else echo "Niente app Android, solo server."; fi
      - if: steps.has.outputs.android
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - if: steps.has.outputs.android
        uses: gradle/actions/setup-gradle@v4
      - name: Chiave dai Secrets (se configurata)
        if: steps.has.outputs.android
        working-directory: android
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          SP: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KA: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KP: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > upload-key.jks
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$PWD/upload-key.jks" "$SP" "$KA" "$KP" > keystore.properties
          fi
      - name: Compila
        if: steps.has.outputs.android
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace
      - name: APK
        if: steps.has.outputs.android
        working-directory: android
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/apk/"
          ls -la "$GITHUB_WORKSPACE/apk"
      - if: steps.has.outputs.android
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apk/*.apk

  server:
    needs: apk
    # Ubuntu 24.04: il binario gira su Ubuntu Server 24.04 e successivi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # pagina web: React + Vite → frontend/dist (il server la incorpora)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pagina web
        working-directory: frontend
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Formato e controlli (rustfmt, clippy)
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings
      - name: Prove
        run: cargo test --locked
      - name: Server
        run: cargo build --release --locked -p sapp
      - uses: actions/download-artifact@v4
        if: hashFiles('android/settings.gradle') != ''
        with:
          name: apk
          path: apk
      - name: Pacchetto
        id: pkg
        env:
          SAPP_FIRMA: ${{ secrets.SAPP_FIRMA }}
          EVENTO: ${{ github.event_name }}
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          D=s-app-v$V
          mkdir -p "$D"
          cp target/release/sapp packaging/* "$D/"
          # l'APK nella cartella principale del pacchetto (install.sh lo mette dove il server lo offre ai telefoni)
          if compgen -G "apk/*.apk" >/dev/null; then cp apk/*.apk "$D/"; fi
          chmod +x "$D"/*.sh
          ./target/release/sapp --version
          echo "programma: $(stat -c %s target/release/sapp) byte"
          if [ -f packaging/firma.pub ]; then
            if [ -n "$SAPP_FIRMA" ]; then
              (cd "$D" && sha256sum * > SHA256SUMS)
              umask 077
              printf '%s\n' "$SAPP_FIRMA" > "$RUNNER_TEMP/firma.pem"
              openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/firma.pem" -in "$D/SHA256SUMS" -out "$D/SHA256SUMS.sig"
              rm -f "$RUNNER_TEMP/firma.pem"
            elif [ "$EVENTO" = "pull_request" ]; then
              echo "::warning::Pull request: zip non firmato (il segreto SAPP_FIRMA non c'è qui), non si pubblica comunque"
            else
              echo "::error::C'è packaging/firma.pub ma manca il segreto SAPP_FIRMA: senza firma il server non installerebbe lo zip"
              exit 1
            fi
          fi
          zip -qr "$D.zip" "$D"
          # il server compilato qui controlla lo zip come farà sul server
          ./target/release/sapp verify-package "$D.zip"
          echo "v=$V" >> "$GITHUB_OUTPUT"
          if compgen -G "apk/*.apk" >/dev/null; then
            APK=$(ls apk/*.apk | head -1)
            AV=$(basename "$APK" .apk | sed "s/^$APP //")
            cp "$APK" "$APP-$AV.apk"
            echo "apk=$APP-$AV.apk" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: s-app-v${{ steps.pkg.outputs.v }}
          path: s-app-v${{ steps.pkg.outputs.v }}.zip
      - name: Pubblica Release
        # s-core è il modello: si prova tutto ma non si pubblica
        if: github.event_name != 'pull_request' && github.event.repository.name != 's-core'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.pkg.outputs.v }}
          APK: ${{ steps.pkg.outputs.apk }}
        run: |
          # una versione si pubblica una volta sola: per una nuova, alza `version` in Cargo.toml ([workspace.package])
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "::warning::La release v$V esiste già e resta com'è: per pubblicarne una nuova alza la versione in Cargo.toml"
            exit 0
          fi
          NOTE="Da caricare dalla pagina dell'amministratore: Aggiornamenti → scegli lo zip → Installa."
          # (un apostrofo dentro ${APK:+…} fra virgolette rompe bash: la frase in più si aggiunge a parte)
          if [ -n "$APK" ]; then NOTE="$NOTE L'app Android è dentro lo zip (il server la offre ai telefoni) e qui sotto."; fi
          gh release create "v$V" "s-app-v$V.zip" $APK -t "SApp $V" -n "$NOTE"
